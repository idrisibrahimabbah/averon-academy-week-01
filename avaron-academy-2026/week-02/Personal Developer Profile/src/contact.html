<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a  href="./index.html">Go To Home</a>
<h1>Contact Me</h1>
</nav>
    
    <div id="contact-me" class="card">
        <form action="" id="form">
        <label for="name">Full Name:</label>
        <input type="text" placeholder="Enter Full Name" id="name">
        <label for="text">Email:</label>
        <input type="text" placeholder="Enter Email" id="email">
        <label for="phone">Phone Number:</label>
        <input type="tel" placeholder="+234-1234-XXX-XXXX" id="phone" maxlength="11">
        <label for="textarea"> Message:</label>
        <textarea type="textarea" placeholder="Type Here" id="textbox"></textarea>
        <button type="submit" id="submit"> Submit</button>
    </form>

    </div>
     <footer> &copy;Copyright 2026 </footer>
</body>
</html>
