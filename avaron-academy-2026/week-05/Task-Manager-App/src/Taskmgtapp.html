
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>
    <link rel="stylesheet" href="Taskmgtapp.css">
</head>
<body>

    <div class="container">

        <h1>Task Manager App</h1>
        <p>Organize your daily tasks!</p>

        <!-- Add Task Section -->
        <div class="input-section">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addBtn">Add Task</button>
        </div>

        <!-- Sorting Section -->
        <div class="sort-section">
            <label for="sortTasks">Sort Tasks:</label>

            <select id="sortTasks">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="az">Alphabetically (A-Z)</option>
                <option value="za">Alphabetically (Z-A)</option>
                <option value="completed">Completed First</option>
                <option value="pending">Pending First</option>
            </select>
        </div>

        <!-- Task Statistics -->
        <div class="stats">
            <span id="totalTasks">Total: 0</span>
            <span id="completedTasks">Completed: 0</span>
            <span id="pendingTasks">Pending: 0</span>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>

    <script src="Taskmgtapp.js"></script>
</body>
</html>
