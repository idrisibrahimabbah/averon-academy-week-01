
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts Explorer</title>

    <link rel="stylesheet" href="searchPosts.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">

            <div>
                <h1>Posts Explorer</h1>
                <p>Explore and discover interesting posts.</p>
            </div>

            <button id="themeBtn" class="theme-btn">
                🌙 Dark Mode
            </button>

        </header>


        <!-- Search and Controls -->
        <section class="controls">

            <input
                type="search"
                id="searchInput"
                placeholder="Search posts by title..."
            >

            <select id="userFilter">
                <option value="all">All Users</option>
                <option value="1">User 1</option>
                <option value="2">User 2</option>
                <option value="3">User 3</option>
                <option value="4">User 4</option>
                <option value="5">User 5</option>
                <option value="6">User 6</option>
                <option value="7">User 7</option>
                <option value="8">User 8</option>
                <option value="9">User 9</option>
                <option value="10">User 10</option>
            </select>

            <button id="reloadBtn">
                ↻ Reload Posts
            </button>

        </section>


        <!-- Status Message -->
        <p id="statusMessage" aria-live="polite">
            Loading posts...
        </p>


        <!-- Posts Information -->
        <div class="posts-info">
            <span id="postsCount"></span>
        </div>


        <!-- Posts Container -->
        <section id="postsContainer" class="posts-container">

        </section>


        <!-- Pagination -->
        <div class="pagination">

            <button id="loadMoreBtn">
                Load More Posts
            </button>

        </div>

    </main>

    <script src="searchPosts.js"></script>

</body>
</html>
